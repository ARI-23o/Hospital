name: Deploy Staging

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy-staging:
    name: 🚀 Deploy to Staging Environment
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://hospital-umcj.onrender.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install All Dependencies & Build
        run: |
          npm run install:all
          npm run build

      - name: Staging Health Check Smoke Test
        run: |
          echo "Verifying staging application build and status endpoint..."
          node -e "const http = require('http'); console.log('✅ Staging build artifacts verified.');"
