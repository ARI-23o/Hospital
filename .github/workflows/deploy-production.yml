name: Deploy Production

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version tag (e.g., v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  deploy-production:
    name: Production Release and Health Check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hospital-umcj.onrender.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install All Dependencies and Build
        run: |
          npm run install:all
          npm run build

      - name: Production Deployment Verification
        run: |
          echo "Verifying production build bundle..."
          test -d client/dist && test -f client/dist/index.html
          echo "Production artifacts verified successfully."
