<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chandrapura Kidney Care | Dr. Sagar Sadar - Consultant Nephrologist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-teal-500 selection:text-white">
    <div id="root">
      <div
        style="
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #0a1d37;
          color: white;
          font-family:
            system-ui,
            -apple-system,
            sans-serif;
        "
      >
        <div
          style="
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: rgba(13, 148, 136, 0.2);
            border: 1px solid rgba(45, 212, 191, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            animation: pulse 1.5s infinite ease-in-out;
          "
        >
          🏥
        </div>
        <h1 style="font-size: 18px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.02em">
          Chandrapura Kidney Care
        </h1>
        <p style="font-size: 12px; color: #94a3b8; margin: 0">
          Loading Clinical Portal & Doctor Schedule...
        </p>
        <style>
          @keyframes pulse {
            0%,
            100% {
              transform: scale(1);
              opacity: 0.8;
            }
            50% {
              transform: scale(1.08);
              opacity: 1;
            }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
